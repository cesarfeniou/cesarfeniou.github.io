name: Sync Google Scholar

on:
  schedule:
    - cron: '0 6 1 * *'   # first day of every month at 06:00 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly==1.7.11 bibtexparser==1.4.3

      - name: Run Scholar sync
        env:
          SCHOLAR_ID: atHK9rYAAAAJ
        run: python scripts/sync_scholar.py

      - name: Commit updated bibliography
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git diff --cached --quiet || git commit -m "chore: sync publications from Google Scholar"
          git push
